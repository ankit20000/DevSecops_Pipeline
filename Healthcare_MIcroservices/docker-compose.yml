services:
  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"

  patient-service:
    build: ./patient-service
    ports:
      - "8002:8002"

  appointment-service:
    build: ./appointment-service
    ports:
      - "8003:8003"

  report-service:
    build: ./report-service
    ports:
      - "8004:8004"

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # endpoint="jaeger:4317"

volumes:
  postgres_data:
  